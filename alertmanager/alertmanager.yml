# Alertmanager du lab : les alertes sont visibles sur http://localhost:9093 et dans
# Grafana (Alerting > Alertmanager "Alertmanager"). Aucune notification n'est envoyée
# vers l'extérieur ; pour en ajouter, déclarer un receiver (Slack, e-mail, webhook...)
# en lisant le secret depuis un fichier (ex. api_url_file) monté hors du dépôt.

route:
  receiver: lab-null
  group_by: [alertname, job, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: lab-null

inhibit_rules:
  # Un critical masque le warning de la même alerte
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, job]
  # Sans métriques, inutile d'alerter aussi sur l'absence de commandes
  - source_matchers: [alertname="JavaDemoMetricsAbsent"]
    target_matchers: [alertname="JavaDemoNoOrders"]
    equal: [job]
