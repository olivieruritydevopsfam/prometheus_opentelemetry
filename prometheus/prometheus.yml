global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Métriques applicatives (JVM, HTTP, métier) ré-exposées par le Collector.
  # honor_labels conserve job/instance dérivés de service.name / service.instance.id.
  - job_name: otel-collector-exporter
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Métriques internes du Collector (otelcol_receiver_*, otelcol_exporter_*, ...)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
