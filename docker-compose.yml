name: otel-lab

services:
  java-demo:
    build:
      context: ./apps/java-demo
      args:
        OTEL_AGENT_VERSION: "2.20.1"
    image: otel-lab/java-demo:0.1.0
    ports:
      - "8080:8080"
    environment:
      # Heap max explicite (sinon 1/4 de la RAM de la VM Docker) ; JDK_JAVA_OPTIONS
      # s'ajoute à JAVA_TOOL_OPTIONS (agent) au lieu de le remplacer
      JDK_JAVA_OPTIONS: -Xmx512m
      OTEL_SERVICE_NAME: java-demo
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=lab,service.version=0.1.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      # Pas encore de backend traces/logs dans ce lab
      OTEL_TRACES_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Même app, SANS agent OTel : simule une JVM existante qu'on ne peut pas instrumenter.
  # Seul le JMX distant est activé ; les métriques sont lues de l'extérieur par jmx-scraper.
  # Pas d'auth ni de TLS JMX : acceptable uniquement sur ce réseau Docker local (port non publié).
  java-demo-jmx:
    image: otel-lab/java-demo:0.1.0
    depends_on:
      java-demo:
        condition: service_started   # garantit que l'image est construite
    ports:
      - "8081:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=java-demo-jmx
      # Publie les MBeans Tomcat (GlobalRequestProcessor, ThreadPool...) de Tomcat embarqué
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  jmx-scraper:
    build:
      context: ./jmx-scraper
      args:
        JMX_SCRAPER_VERSION: "1.61.0-alpha"
    image: otel-lab/jmx-scraper:1.61.0-alpha
    environment:
      OTEL_JMX_SERVICE_URL: service:jmx:rmi:///jndi/rmi://java-demo-jmx:9010/jmxrmi
      OTEL_JMX_TARGET_SYSTEM: jvm,tomcat
      OTEL_JMX_TARGET_SOURCE: instrumentation
      # Règles maison en plus des cibles prédéfinies (GC)
      OTEL_JMX_CONFIG: /etc/jmx-scraper/gc.yaml
      OTEL_SERVICE_NAME: java-demo-jmx
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=lab,service.version=0.1.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Contrôle aussi la fréquence de lecture des MBeans
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    depends_on:
      java-demo-jmx:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

  # Image distroless (ni shell ni curl) : pas de healthcheck Docker possible.
  # Santé exposée sur :13133 et surveillée par Prometheus (up{job="otel-collector"}).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # métriques internes
      - "8889:8889"   # exporter Prometheus
      - "13133:13133" # health_check
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.external-url=http://localhost:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/java-demo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  load-generator:
    image: grafana/k6:1.3.0
    command: ["run", "--quiet", "/scripts/script.js"]
    environment:
      BASE_URLS: http://java-demo:8080,http://java-demo-jmx:8080
      VUS: "5"
    volumes:
      - ./load-generator/script.js:/scripts/script.js:ro
    depends_on:
      java-demo:
        condition: service_healthy
      java-demo-jmx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
