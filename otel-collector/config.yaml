# OpenTelemetry Collector — pipeline metrics : OTLP -> batch -> Prometheus
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protège le Collector en cas de pic (à placer en premier)
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  # Endpoint scrapé par Prometheus
  prometheus:
    endpoint: 0.0.0.0:8889
    # Les attributs de ressource restent dans target_info (évite d'exploser la cardinalité)
    resource_to_telemetry_conversion:
      enabled: false
    # Les séries disparaissent 1 min après le dernier export de l'app (export toutes les 10 s) :
    # c'est ce délai qui permet à JavaDemoMetricsAbsent de se déclencher vite.
    metric_expiration: 1m
  # Logs synthétiques dans `docker compose logs otel-collector` pour le debug
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
  telemetry:
    # Métriques internes du Collector (otelcol_*), scrapées par Prometheus
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
